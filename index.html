<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="body">
    <header class="header">
      <h1 class="hidden">To Do App with the Eisenhower Matrix</h1>
      <img src="./eisenhower-matrix.jpg" alt="Eisenhower Matrix" class="header-img" /><a
        class="header-link"
        href="https://goal-life.com/page/method/matrix-eisenhower"
        >Want more details?</a
      >
    </header>
    <main class="main">
      <section id="section-add">
        <label for="new-task">Add Item</label>
        <div class="task-wrapper"><input id="new-task" class="task" type="text" /><button class="btn">Add</button></div>
      </section>
      <section id="section-todo">
        <h2 class="heading">Todo</h2>
        <ul class="tasks-list" id="active-tasks">
          <li class="tasks-item">
            <input class="checkbox" type="checkbox" /><label class="task">Pay Bills</label
            ><input type="text" class="task" /><button class="btn btn-edit">Edit</button
            ><button class="btn btn-delete"><img src="./remove.svg" alt="Remove Icon" /></button>
          </li>
          <li class="tasks-item edit-mode">
            <input class="checkbox" type="checkbox" /><label class="task">Go Shopping</label
            ><input type="text" value="Go Shopping" class="task" /><button class="btn btn-edit">Save</button
            ><button class="btn btn-delete"><img src="./remove.svg" alt="Remove Icon" /></button>
          </li>
        </ul>
      </section>
      <section id="section-done">
        <h2 class="heading">Completed</h2>
        <ul class="tasks-list" id="completed-tasks">
          <li class="tasks-item">
            <input class="checkbox" type="checkbox" checked /><label class="task">See the Doctor</label
            ><input type="text" class="task" /><button class="btn btn-edit">Edit</button
            ><button class="btn btn-delete"><img src="./remove.svg" alt="Remove Icon" /></button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
